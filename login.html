<style>
    body{
        margin: 0;
        min-height: 100vh;
        background-image: url("https://images.unsplash.com/photo-1776592708149-a42956c91138?q=80&w=1472&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        justify-content: center;
        align-items: center;
        display: flex;
        min-height: 100%;
    }
    input{
        font-size:100%;
        padding: 20px 40px;
        border: 1px solid rgba(104, 13, 13, 0.5);
        border-radius: 12px;
        background:rgba(255, 255, 255, 0.5);
        color:black;
        outline: none;
        backdrop-filter:blur(8px);
        transition:0.3s;
    }
    .login-box h1 {
        font-family: 'Segoe UI', sans-serif;
        font-size: 32px;
        font-weight: 600;
        color: rgb(0, 0, 0);
        text-align: center;

        margin-bottom: 25px;
        letter-spacing: 2px;

        text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
     }
    

    
    </style>

    <body>
        <div class="login-box">
            <h1>What do I call you?</h1>
            <form onsubmit="return loginuser(event)">
                <input
                type="text"
                placehodler="Your Name"
                id="Celyn"
                required
                >
                <button type="submit">Log In</button>
            </form> </div>

            <script>
                function loginuser(event){
                    event.preventDefault();

                    let name = document.getElementById("Celyn").value;

                    if (name === "Celyn") {
                        window.location.href = "Testing.html";
                    } else {
                        alert("That's not what I call you!");
                    }

                    return false;
                }
            </script>
    </body>
